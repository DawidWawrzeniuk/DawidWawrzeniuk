name: Generate Snake

on:
  # Uruchamiaj automatycznie co 24 godziny
  schedule:
    - cron: "0 0 * * *"
  
  # Pozwala uruchomić ręcznie w dowolnym momencie
  workflow_dispatch:
  
  # Uruchamiaj przy każdym wypchnięciu zmian do gałęzi main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generuje węża na podstawie profilu DawidWawrzeniuk
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DawidWawrzeniuk
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Wypycha wygenerowany plik do specjalnej gałęzi "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
