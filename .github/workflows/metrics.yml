name: Metrics
on:
  # Automatyczne odświeżanie co 12 godzin
  schedule: [{cron: "0 */12 * * *"}]
  # Pozwala na ręczne uruchomienie w dowolnym momencie
  workflow_dispatch:
  # Odświeża przy zmianach w repozytorium
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css # Ignoruje proste pliki, skupia się na C/C++/C#
          plugin_languages_details: bytes-size, percentage
          theme: midnight
